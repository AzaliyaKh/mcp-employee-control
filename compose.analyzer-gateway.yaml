# Start only the gateway for the selected provider. No host ports are published.
services:
  codex-gateway:
    profiles: [codex]
    build:
      context: .
      dockerfile: Dockerfile.analyzer-gateway
    command: [codex_cli]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    volumes:
      - codex-socket:/gateway
    logging:
      driver: none
  claude-gateway:
    profiles: [claude]
    build:
      context: .
      dockerfile: Dockerfile.analyzer-gateway
    command: [claude_code]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    volumes:
      - claude-socket:/gateway
    logging:
      driver: none
volumes:
  codex-socket:
    name: worklog-codex-gateway
  claude-socket:
    name: worklog-claude-gateway
